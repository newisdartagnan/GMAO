# =====================================================================
#  GMAO hospitalière — pile complète
#
#  Trois services indispensables (base, API, interface) et un quatrième
#  facultatif pour l'administration de la base. Tout tourne sur un seul
#  serveur de l'établissement ; rien ne sort du réseau local.
#
#      docker compose up -d
#      → interface        http://localhost:8080
#      → administration   http://localhost:8081   (profil « admin »)
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: gmao-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gmao}
      POSTGRES_USER: ${DB_USER:-gmao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans le fichier .env}
      # Le tri et la comparaison des chaînes suivent le français : sans cela,
      # « Équipement » se classe après « Zone » dans les listes.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-Africa/Kinshasa}
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
      # Les sauvegardes produites par pg_dump atterrissent dans ce dossier du
      # serveur, prêtes à être copiées sur un support externe.
      - ./sauvegardes:/sauvegardes
    ports:
      # Publié sur la boucle locale seulement : l'accès distant se fait par
      # tunnel, pas en exposant PostgreSQL au réseau. Le port par défaut évite
      # 5432 (PostgreSQL installé sur la machine) et 5433 (souvent pris par une
      # autre pile de conteneurs).
      - "127.0.0.1:${DB_PORT_HOTE:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gmao} -d ${DB_NAME:-gmao}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: gmao-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      API_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gmao}
      DB_USER: ${DB_USER:-gmao}
      DB_PASSWORD: ${DB_PASSWORD:?définir DB_PASSWORD dans le fichier .env}
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans le fichier .env}
      JWT_DUREE: ${JWT_DUREE:-12h}
      # L'interface et l'API partagent la même origine derrière nginx :
      # la liste ci-dessous ne sert qu'au développement.
      CORS_ORIGINES: ${CORS_ORIGINES:-http://localhost:5173}
      SEED_AU_DEMARRAGE: ${SEED_AU_DEMARRAGE:-true}
      MOT_DE_PASSE_PAR_DEFAUT: ${MOT_DE_PASSE_PAR_DEFAUT:-gmao2026}
      # Formulaire externe de signalement. Tout est facultatif : sans ces
      # variables le connecteur dort et l'application ne change pas.
      FORMULAIRE_SOURCE: ${FORMULAIRE_SOURCE:-}
      FORMULAIRE_URL: ${FORMULAIRE_URL:-}
      FORMULAIRE_PARAM_CODE: ${FORMULAIRE_PARAM_CODE:-equipement}
      FORMULAIRE_BASE_QR: ${FORMULAIRE_BASE_QR:-}
      FORMULAIRE_CHAMPS: ${FORMULAIRE_CHAMPS:-}
      FORMULAIRE_SECRET_WEBHOOK: ${FORMULAIRE_SECRET_WEBHOOK:-}
      FORMULAIRE_INTERVALLE_MIN: ${FORMULAIRE_INTERVALLE_MIN:-5}
      FORMULAIRE_COMPTE_SERVICE: ${FORMULAIRE_COMPTE_SERVICE:-}
      MSFORMS_MODE: ${MSFORMS_MODE:-graph}
      MSFORMS_AUTH: ${MSFORMS_AUTH:-delegue}
      MSFORMS_TENANT_ID: ${MSFORMS_TENANT_ID:-consumers}
      MSFORMS_REFRESH_TOKEN: ${MSFORMS_REFRESH_TOKEN:-}
      MSFORMS_CLIENT_ID: ${MSFORMS_CLIENT_ID:-}
      MSFORMS_CLIENT_SECRET: ${MSFORMS_CLIENT_SECRET:-}
      MSFORMS_CLASSEUR: ${MSFORMS_CLASSEUR:-}
      MSFORMS_TABLEAU: ${MSFORMS_TABLEAU:-Tableau1}
      JOTFORM_API_KEY: ${JOTFORM_API_KEY:-}
      JOTFORM_FORMULAIRE_ID: ${JOTFORM_FORMULAIRE_ID:-}
      JOTFORM_API_BASE: ${JOTFORM_API_BASE:-https://api.jotform.com}
      TZ: ${TZ:-Africa/Kinshasa}
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${API_PORT_HOTE:-3001}:3001"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: gmao-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Africa/Kinshasa}

  # Ouverture des créneaux d'inspection à 6 h 30 et 16 h 30, avant chaque
  # prise de service : la ronde existe même si personne ne se connecte, et un
  # créneau non fait se voit le lendemain au lieu de disparaître.
  planificateur:
    image: alpine:3.20
    container_name: gmao-planificateur
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TZ:-Africa/Kinshasa}
      COMPTE_SERVICE: ${COMPTE_SERVICE:-}
      MOT_DE_PASSE_SERVICE: ${MOT_DE_PASSE_SERVICE:-}
    volumes:
      - ./scripts/ouvrir-rondes.sh:/usr/local/bin/ouvrir-rondes.sh:ro
    command: >
      sh -c "apk add --no-cache curl tzdata >/dev/null &&
             echo '30 6,16 * * * /usr/local/bin/ouvrir-rondes.sh >> /var/log/rondes.log 2>&1' > /etc/crontabs/root &&
             crond -f -l 8"
    profiles: ["planificateur"]

  # Administration de la base avec pgAdmin 4 : c'est l'outil de référence pour
  # PostgreSQL, et celui qui permet de reprendre les données de l'hôpital à la
  # main — corriger une ligne, supprimer un jeu d'essai, importer un inventaire.
  # La connexion au serveur est déjà déclarée : rien à saisir à la première
  # ouverture, hormis le mot de passe de la base.
  #
  #      docker compose --profile admin up -d
  #      → http://localhost:8082
  #
  # Après toute modification faite ici, demander à l'application de relire les
  # tables : Paramètres › Base de données › « Recharger depuis la base ».
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: gmao-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hopital.local}
      # Pas de garde « :? » ici, contrairement à DB_PASSWORD : Compose
      # interpole tous les services, profils inactifs compris. Une garde sur
      # un outil facultatif ferait donc échouer « docker compose up » tout
      # entier, y compris l'interface et l'API — un confort d'administration
      # ne doit jamais pouvoir arrêter l'hôpital. Vide, seul pgAdmin refuse de
      # démarrer, et le dit dans son journal.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      # pgAdmin valide l'adresse du compte et, selon les versions, refuse de
      # démarrer sur un domaine qu'il ne peut pas résoudre — ce qui est le cas
      # de « .local ». Le contrôle est désactivé : cette adresse n'est qu'un
      # identifiant de connexion, aucun courrier ne part.
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      # Sans cela pgAdmin réclame un mot de passe maître à chaque ouverture,
      # en plus de celui du compte : une gêne sans gain sur un poste unique.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      TZ: ${TZ:-Africa/Kinshasa}
    volumes:
      - donnees-pgadmin:/var/lib/pgadmin
      - ./scripts/pgadmin-serveurs.json:/pgadmin4/servers.json:ro
      # Rien d'autre n'est monté sous /var/lib/pgadmin : ce dossier appartient
      # à l'utilisateur 5050 dans le conteneur, et un dossier de l'hôte greffé
      # dedans empêche pgAdmin de démarrer. Les fichiers à importer se
      # téléversent depuis la fenêtre d'import de pgAdmin.
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8082}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # pgAdmin met une bonne minute à se lever au premier démarrage : il
      # construit sa base de configuration et importe la liste des serveurs.
      start_period: 120s
    profiles: ["admin"]

  # Administration de la base, version légère : une seule page, pratique pour
  # une requête ponctuelle sans ouvrir pgAdmin. Même profil « admin ».
  adminer:
    image: adminer:4-standalone
    container_name: gmao-adminer
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
      TZ: ${TZ:-Africa/Kinshasa}
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    profiles: ["admin"]

volumes:
  donnees-postgres:
    name: gmao-donnees-postgres
  donnees-pgadmin:
    name: gmao-donnees-pgadmin
