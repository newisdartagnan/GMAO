server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers texte représentent l'essentiel du volume, et l'instantané
    # de la base pèse plusieurs mégaoctets : la compression est indispensable
    # sur un réseau d'établissement.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # En-têtes de sécurité de base. La politique de contenu reste stricte :
    # l'application ne charge aucune ressource tierce.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'instantané complet peut demander quelques secondes sur un serveur
        # modeste ; le peuplement initial davantage.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 16m;
    }

    # Les fichiers produits par la compilation portent une empreinte dans leur
    # nom : ils peuvent être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application à page unique : toute route inconnue renvoie index.html,
    # que le routeur du navigateur se charge d'interpréter.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais être mis en cache, sinon un poste continue
    # d'utiliser une version périmée après une mise à jour.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
